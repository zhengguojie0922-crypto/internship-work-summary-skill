{
  "name": "test",
  "on": ["push", "pull_request"],
  "permissions": {"contents": "read"},
  "jobs": {
    "test": {
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 15,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": ["ubuntu-latest", "windows-latest", "macos-latest"],
          "python-version": ["3.10", "3.x"]
        }
      },
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "${{ matrix.python-version }}"
          }
        },
        {
          "name": "Verify Git 2.30 or newer",
          "shell": "python {0}",
          "run": "import re\nimport subprocess\n\n# Equivalent diagnostic: git --version\nraw = subprocess.run([\"git\", \"--version\"], check=True, capture_output=True, text=True).stdout.strip()\nprint(raw)\nmatch = re.search(r\"(\\d+)\\.(\\d+)\", raw)\nif match is None:\n    raise SystemExit(\"could not parse Git version\")\nversion = tuple(map(int, match.groups()))\nif version < (2, 30):\n    raise SystemExit(f\"Git 2.30+ is required; found {raw}\")"
        },
        {
          "name": "Run unit tests",
          "run": "python -m unittest discover -s tests -v"
        }
      ]
    }
  }
}
